<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Supertonic TTS 테스트</title>
<style>
  body { font-family: system-ui, "Malgun Gothic", sans-serif; max-width: 720px; margin: 40px auto; padding: 0 16px; color: #222; }
  h1 { font-size: 22px; }
  textarea { width: 100%; height: 120px; font-size: 15px; padding: 8px; box-sizing: border-box; }
  .row { display: flex; flex-wrap: wrap; gap: 12px; margin: 12px 0; }
  label { display: flex; flex-direction: column; font-size: 13px; gap: 4px; }
  select, input { font-size: 14px; padding: 4px 6px; }
  button { font-size: 15px; padding: 8px 20px; cursor: pointer; }
  audio { width: 100%; margin-top: 16px; }
  #status { margin-top: 12px; font-size: 14px; color: #555; }
  #status.error { color: #c00; white-space: pre-wrap; }
</style>
</head>
<body>
<h1>Supertonic TTS 테스트</h1>
<textarea id="text">안녕하세요. 수퍼토닉 음성 합성 테스트입니다.</textarea>
<div class="row">
  <label>보이스 <select id="voice"></select></label>
  <label>언어 <select id="lang"></select></label>
  <label>속도 <input id="speed" type="number" value="1.05" min="0.7" max="2.0" step="0.05"></label>
  <label>품질(steps) <input id="steps" type="number" value="8" min="1" max="50"></label>
  <label>포맷
    <select id="format"><option>wav</option><option>mp3</option><option>flac</option><option>ogg</option></select>
  </label>
  <label>API Key <input id="apikey" type="password" placeholder="(설정한 경우만)"></label>
</div>
<button id="go">합성</button>
<div id="status"></div>
<audio id="player" controls hidden></audio>
<div><a id="download" hidden>다운로드</a></div>

<script>
const $ = (id) => document.getElementById(id);

function headers() {
  const h = { "content-type": "application/json" };
  if ($("apikey").value) h["Authorization"] = "Bearer " + $("apikey").value;
  return h;
}

async function fillSelect(path, key, el) {
  const r = await fetch(path, { headers: headers() });
  if (!r.ok) return;
  const data = await r.json();
  el.innerHTML = data[key].map((v) => `<option ${v === data.default ? "selected" : ""}>${v}</option>`).join("");
}

async function loadOptions() {
  await fillSelect("/v1/voices", "voices", $("voice"));
  await fillSelect("/v1/languages", "languages", $("lang"));
}

$("apikey").addEventListener("change", loadOptions);

$("go").addEventListener("click", async () => {
  const status = $("status");
  status.className = "";
  status.textContent = "합성 중...";
  $("go").disabled = true;
  try {
    const r = await fetch("/v1/tts", {
      method: "POST",
      headers: headers(),
      body: JSON.stringify({
        text: $("text").value,
        voice: $("voice").value,
        lang: $("lang").value,
        speed: parseFloat($("speed").value),
        steps: parseInt($("steps").value, 10),
        response_format: $("format").value,
      }),
    });
    if (!r.ok) throw new Error(`${r.status}\n${await r.text()}`);
    const url = URL.createObjectURL(await r.blob());
    const player = $("player");
    if (player.src) URL.revokeObjectURL(player.src);
    player.src = url;
    player.hidden = false;
    player.play();
    const dl = $("download");
    dl.href = url;
    dl.download = "tts." + $("format").value;
    dl.hidden = false;
    status.textContent = `오디오 ${r.headers.get("x-audio-duration")}초 / 처리 ${r.headers.get("x-processing-time")}초`;
  } catch (e) {
    status.className = "error";
    status.textContent = "오류: " + e.message;
  } finally {
    $("go").disabled = false;
  }
});

loadOptions();
</script>
</body>
</html>
